<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>疾管署｜呼吸道病毒週報解讀</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="eyebrow">NIDSS LARS ＋ NNDSS 19SC</p>
      <h1>疾管署｜呼吸道病毒週報解讀</h1>
      <p class="sub">靜態瀏覽各週解讀與正式圖表（TimesFM「未來8週平均」為未來 8 週參照，非近 8 週實測平均）</p>
      <div class="week-bar">
        <button type="button" id="prevWeek" aria-label="上一週">‹</button>
        <label class="week-select">
          <span>年週</span>
          <select id="weekSelect"></select>
        </label>
        <button type="button" id="nextWeek" aria-label="下一週">›</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="app">
    <p class="loading" id="status">載入中…</p>
  </main>

  <footer class="foot wrap">
    <p>資料來源：疾管署 NIDSS。本站為靜態解讀瀏覽器，非正式疾管署網站。</p>
    <p><a href="https://github.com/idnerdtw/nidss-weekly-viewer">GitHub</a></p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
